<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Опросник из JSON</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #e2e5ea;
    --border-input: #cfd5dd; --text: #1a1a1a; --muted: #6b7280;
    --preview-bg: #f3f4f6; --preview-text: #374151;
    --btn-bg: #2563eb; --btn-text: #fff;
    --btn-secondary-bg: #e5e7eb; --btn-secondary-text: #111;
    --error: #b91c1c; --ok: #15803d; --divider: #eef0f3;
    --input-bg: #fff; --input-disabled-bg: #f3f4f6; --input-disabled-text: #9ca3af;
    --radius: 12px; --radius-sm: 8px;
    --shadow-panel: 0 1px 2px rgba(0,0,0,.04);
    --focus-ring: rgba(37,99,235,.15);
  }
  [data-theme="dark"] {
    --bg: #0f1115; --panel: #161a21; --border: #2a2f38;
    --border-input: #3a4049; --text: #e7eaee; --muted: #9aa3ad;
    --preview-bg: #1e232b; --preview-text: #c5ccd6;
    --btn-bg: #3b82f6; --btn-text: #fff;
    --btn-secondary-bg: #2a2f38; --btn-secondary-text: #e7eaee;
    --error: #f87171; --ok: #34d399; --divider: #232830;
    --input-bg: #12161c; --input-disabled-bg: #1a1f26; --input-disabled-text: #6b7280;
    --shadow-panel: 0 1px 3px rgba(0,0,0,.3);
    --focus-ring: rgba(59,130,246,.22);
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 880px; margin: 0 auto; padding: 20px 16px 40px;
    background: var(--bg); color: var(--text); line-height: 1.55;
    transition: background-color .15s, color .15s;
    font-size: 15px;
  }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 1.4rem; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
    margin-bottom: 16px; box-shadow: var(--shadow-panel);
    transition: background-color .15s, border-color .15s;
  }
  label b { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
  textarea, input[type=text], select {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border-input);
    border-radius: var(--radius-sm); font: inherit; background: var(--input-bg); color: var(--text);
    transition: border-color .15s, box-shadow .15s, background-color .15s;
  }
  textarea:focus, input[type=text]:focus, select:focus {
    outline: none; border-color: var(--btn-bg);
    box-shadow: 0 0 0 3px var(--focus-ring);
  }
  textarea { resize: vertical; }
  #jsonInput { min-height: 150px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  #output { min-height: 150px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  button {
    padding: 9px 16px; border: none; border-radius: var(--radius-sm);
    background: var(--btn-bg); color: var(--btn-text);
    font: inherit; font-weight: 500; cursor: pointer;
    transition: filter .15s, background-color .15s, transform .06s;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: scale(.98); }
  button:focus-visible { outline: 2px solid var(--btn-bg); outline-offset: 2px; }
  button.secondary { background: var(--btn-secondary-bg); color: var(--btn-secondary-text); }
  button.secondary:hover { filter: brightness(.96); }
  .error { color: var(--error); margin-top: 10px; font-size: 14px; }
  .ok { color: var(--ok); margin-top: 10px; font-size: 14px; }
  .muted { color: var(--muted); }
  .question { padding: 16px 0; border-top: 1px solid var(--divider); }
  .question:first-child { border-top: none; padding-top: 0; }
  .q-text { font-weight: 600; margin-bottom: 10px; font-size: 15px; }
  .q-body { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .q-body > input[type=text], .q-body > textarea, .q-body > select, .q-body > .custom-input { width: 100%; }
  input[type=radio], input[type=checkbox] {
    accent-color: var(--btn-bg); width: 16px; height: 16px; cursor: pointer;
    margin: 0;
  }
  label.opt {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 5px 10px; border-radius: var(--radius-sm);
    transition: background-color .12s;
  }
  label.opt:hover { background: var(--preview-bg); }
  label.skip { color: var(--muted); }
  .custom-input:disabled { background: var(--input-disabled-bg); color: var(--input-disabled-text); cursor: not-allowed; }
  .q-preview {
    margin-top: 10px; padding: 8px 12px;
    background: var(--preview-bg); color: var(--preview-text);
    border-radius: var(--radius-sm); border-left: 3px solid var(--btn-bg);
    font-size: 13px; font-style: italic;
    transition: background-color .15s, color .15s;
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>Опросник из JSON</h1>
  <button class="theme-btn secondary" id="themeBtn" title="Переключить тему">🌙 Тема</button>
</div>

<section class="panel">
  <label><b>JSON с вопросами</b></label>
  <textarea id="jsonInput" placeholder="Вставьте сюда JSON…"></textarea>
  <div class="row">
    <button id="loadBtn">Загрузить</button>
    <button id="clearBtn" class="secondary">Очистить</button>
  </div>
  <div id="jsonError" class="error"></div>
</section>

<section class="panel">
  <div id="formTitle" style="font-weight:600; margin-bottom:10px; font-size:16px;"></div>
  <form id="form"></form>
</section>

<section class="panel">
  <label><b>Результат (можно редактировать руками)</b></label>
  <textarea id="output"></textarea>
  <div class="row">
    <button id="copyBtn">Скопировать</button>
    <button id="refreshBtn" class="secondary">Обновить из ответов</button>
  </div>
  <div id="copyStatus" class="ok"></div>
</section>

<script>
(function () {
  const jsonInput = document.getElementById('jsonInput');
  const form = document.getElementById('form');
  const formTitle = document.getElementById('formTitle');
  const output = document.getElementById('output');
  const jsonError = document.getElementById('jsonError');
  const copyStatus = document.getElementById('copyStatus');
  const themeBtn = document.getElementById('themeBtn');

  let questions = [];

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'dark' ? '☀️ Тема' : '🌙 Тема';
  }
  themeBtn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });

  function el(tag, cls, txt) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  function fillTemplate(tpl, q, value) {
    return tpl
      .replace(/\{answer\}/g, value)
      .replace(/\{question\}/g, q.text)
      .replace(/\{id\}/g, q.id);
  }

  function formatList(arr, sep, lastSep) {
    if (!arr.length) return '';
    if (arr.length === 1) return arr[0];
    const s = sep || ', ';
    const ls = lastSep || s;
    return arr.slice(0, -1).join(s) + ls + arr[arr.length - 1];
  }

  function getAnswer(q, i) {
    const block = form.querySelector('.question[data-index="' + i + '"]');
    if (!block) return { skipped: true, values: [] };

    if (q.type === 'select') {
      const sel = block.querySelector('select');
      if (!sel) return { skipped: true, values: [] };
      const v = sel.value;
      if (!v || v === '__skip__') return { skipped: true, values: [] };
      if (v === '__custom__') {
        const ci = block.querySelector('.custom-input');
        const t = ci ? ci.value.trim() : '';
        return t ? { skipped: false, values: [t] } : { skipped: true, values: [] };
      }
      return { skipped: false, values: [v] };
    }

    if (q.type === 'radio' || q.type === 'scale') {
      const c = block.querySelector('input[type=radio]:checked');
      if (!c) return { skipped: true, values: [] };
      if (c.value === '__skip__') return { skipped: true, values: [] };
      if (c.value === '__custom__') {
        const ci = block.querySelector('.custom-input');
        const t = ci ? ci.value.trim() : '';
        return t ? { skipped: false, values: [t] } : { skipped: true, values: [] };
      }
      return { skipped: false, values: [c.value] };
    }

    if (q.type === 'checkbox') {
      const skip = block.querySelector('.skip-cb');
      if (skip && skip.checked) return { skipped: true, values: [] };
      const vals = Array.from(block.querySelectorAll('input.opt:checked')).map(c => c.value);
      const cc = block.querySelector('.custom-cb');
      const ci = block.querySelector('.custom-input');
      if (cc && cc.checked && ci) {
        const t = ci.value.trim();
        if (t) vals.push(t);
      }
      return vals.length ? { skipped: false, values: vals } : { skipped: true, values: [] };
    }

    if (q.type === 'text' || q.type === 'textarea') {
      const skip = block.querySelector('.skip-cb');
      if (skip && skip.checked) return { skipped: true, values: [] };
      const inp = block.querySelector('input[type=text], textarea');
      const t = inp ? inp.value.trim() : '';
      return t ? { skipped: false, values: [t] } : { skipped: true, values: [] };
    }

    return { skipped: true, values: [] };
  }

  function buildLine(q, a) {
    if (a.skipped) {
      const tpl = q.skipTemplate || '{question} — не отвечено';
      return fillTemplate(tpl, q, 'не отвечено');
    }

    const value = a.values.length > 1
      ? formatList(a.values, q.listSeparator, q.listLastSeparator)
      : a.values[0];

    let tpl = q.template;
    if (!tpl) {
      tpl = (q.type === 'scale' && q.max)
        ? '{question} — {answer}/' + q.max
        : '{question} — {answer}';
    }
    return fillTemplate(tpl, q, value);
  }

  function updateOutput() {
    const lines = [];
    questions.forEach((q, i) => {
      const line = buildLine(q, getAnswer(q, i));
      lines.push(line);
      const pv = form.querySelector('.q-preview[data-index="' + i + '"]');
      if (pv) pv.textContent = '→ ' + line;
    });
    output.value = lines.join('\n');
  }

  function renderForm() {
    form.innerHTML = '';
    if (!questions.length) {
      form.appendChild(el('div', 'muted', 'Вопросов нет. Вставьте JSON и нажмите «Загрузить».'));
      return;
    }

    questions.forEach((q, i) => {
      const block = el('div', 'question');
      block.dataset.index = i;
      block.appendChild(el('div', 'q-text', (i + 1) + '. ' + q.text));
      const body = el('div', 'q-body');
      const name = 'q_' + i;

      if (q.type === 'radio' || q.type === 'scale') {
        const opts = (q.type === 'scale')
          ? Array.from({ length: q.max - q.min + 1 }, (_, k) => String(q.min + k))
          : q.options;

        opts.forEach(o => {
          // Извлекаем текст и значение безопасно для объектов и строк
          const optText = (o && typeof o === 'object') ? (o.text || o.label || o.title || JSON.stringify(o)) : String(o);
          const optValue = (o && typeof o === 'object' && o.value !== undefined) ? String(o.value) : optText;

          const lbl = el('label', 'opt');
          const inp = document.createElement('input');
          inp.type = 'radio';
          inp.name = name;
          inp.value = optValue;
          inp.className = 'opt';
          lbl.appendChild(inp);
          lbl.appendChild(document.createTextNode(' ' + optText));
          body.appendChild(lbl);
        });

        const lblC = el('label', 'opt');
        const inpC = document.createElement('input');
        inpC.type = 'radio';
        inpC.name = name;
        inpC.value = '__custom__';
        inpC.className = 'opt';
        lblC.appendChild(inpC);
        lblC.appendChild(document.createTextNode(' Свой вариант'));
        body.appendChild(lblC);

        const ci = document.createElement('input');
        ci.type = 'text';
        ci.className = 'custom-input';
        ci.placeholder = 'Впишите свой ответ';
        ci.disabled = true;
        body.appendChild(ci);

        const lblS = el('label', 'opt skip');
        const inpS = document.createElement('input');
        inpS.type = 'radio';
        inpS.name = name;
        inpS.value = '__skip__';
        lblS.appendChild(inpS);
        lblS.appendChild(document.createTextNode(' Не буду отвечать'));
        body.appendChild(lblS);
      }

      else if (q.type === 'select') {
        const sel = document.createElement('select');
        const ph = document.createElement('option');
        ph.value = '';
        ph.textContent = '— выберите —';
        sel.appendChild(ph);

        q.options.forEach(o => {
          const optText = (o && typeof o === 'object') ? (o.text || o.label || o.title || JSON.stringify(o)) : String(o);
          const optValue = (o && typeof o === 'object' && o.value !== undefined) ? String(o.value) : optText;
          
          const op = document.createElement('option');
          op.value = optValue; op.textContent = optText;
          sel.appendChild(op);
        });

        const opC = document.createElement('option');
        opC.value = '__custom__'; opC.textContent = 'Свой вариант…';
        sel.appendChild(opC);

        const opS = document.createElement('option');
        opS.value = '__skip__'; opS.textContent = 'Не буду отвечать';
        sel.appendChild(opS);

        body.appendChild(sel);

        const ci = document.createElement('input');
        ci.type = 'text';
        ci.className = 'custom-input';
        ci.placeholder = 'Впишите свой ответ';
        ci.disabled = true;
        body.appendChild(ci);
      }

      else if (q.type === 'checkbox') {
        q.options.forEach(o => {
          const optText = (o && typeof o === 'object') ? (o.text || o.label || o.title || JSON.stringify(o)) : String(o);
          const optValue = (o && typeof o === 'object' && o.value !== undefined) ? String(o.value) : optText;

          const lbl = el('label', 'opt');
          const inp = document.createElement('input');
          inp.type = 'checkbox';
          inp.value = optValue;
          inp.className = 'opt';
          lbl.appendChild(inp);
          lbl.appendChild(document.createTextNode(' ' + optText));
          body.appendChild(lbl);
        });

        const lblC = el('label', 'opt');
        const inpC = document.createElement('input');
        inpC.type = 'checkbox';
        inpC.className = 'custom-cb';
        lblC.appendChild(inpC);
        lblC.appendChild(document.createTextNode(' Свой вариант'));
        body.appendChild(lblC);

        const ci = document.createElement('input');
        ci.type = 'text';
        ci.className = 'custom-input';
        ci.placeholder = 'Впишите свой ответ';
        ci.disabled = true;
        body.appendChild(ci);

        const lblS = el('label', 'opt skip');
        const cbS = document.createElement('input');
        cbS.type = 'checkbox';
        cbS.className = 'skip-cb';
        lblS.appendChild(cbS);
        lblS.appendChild(document.createTextNode(' Не буду отвечать'));
        body.appendChild(lblS);
      }

      else if (q.type === 'text' || q.type === 'textarea') {
        const inp = document.createElement(q.type === 'text' ? 'input' : 'textarea');
        if (q.type === 'text') inp.type = 'text';
        else inp.rows = 3;
        inp.placeholder = q.placeholder || '';
        body.appendChild(inp);

        const lblS = el('label', 'opt skip');
        const cbS = document.createElement('input');
        cbS.type = 'checkbox';
        cbS.className = 'skip-cb';
        lblS.appendChild(cbS);
        lblS.appendChild(document.createTextNode(' Не буду отвечать'));
        body.appendChild(lblS);
      }

      else {
        const inp = document.createElement('input');
        inp.type = 'text';
        body.appendChild(inp);
      }

      block.appendChild(body);
      const preview = el('div', 'q-preview');
      preview.dataset.index = i;
      preview.textContent = '→ …';
      block.appendChild(preview);
      form.appendChild(block);
    });
  }

  function loadFromJson() {
    jsonError.textContent = '';
    copyStatus.textContent = '';

    const raw = jsonInput.value.trim();
    if (!raw) { jsonError.textContent = 'Вставьте JSON в поле выше.'; return; }

    let data;
    try { data = JSON.parse(raw); }
    catch (err) { jsonError.textContent = 'Ошибка JSON: ' + err.message; return; }

    let list = null, title = '';
    if (Array.isArray(data)) list = data;
    else if (data && typeof data === 'object' && Array.isArray(data.questions)) {
      list = data.questions; title = data.title || '';
    }
    if (!list) {
      jsonError.textContent = 'Нужен массив вопросов или объект с полем "questions".';
      return;
    }

    questions = list.map((q, i) => ({
      id: String(q.id != null ? q.id : 'q' + (i + 1)),
      type: q.type || 'radio',
      text: String(q.text || 'Вопрос ' + (i + 1)),
      // Больше не приводим к String здесь, чтобы сохранить объекты для рендера
      options: Array.isArray(q.options) ? q.options : [],
      template: typeof q.template === 'string' ? q.template : null,
      skipTemplate: typeof q.skipTemplate === 'string' ? q.skipTemplate : null,
      listSeparator: typeof q.listSeparator === 'string' ? q.listSeparator : ', ',
      listLastSeparator: typeof q.listLastSeparator === 'string' ? q.listLastSeparator : '',
      min: Number.isFinite(q.min) ? q.min : 1,
      max: Number.isFinite(q.max) ? q.max : 10,
      placeholder: typeof q.placeholder === 'string' ? q.placeholder : ''
    }));

    formTitle.textContent = title;
    renderForm();
    updateOutput();
  }

  form.addEventListener('change', (e) => {
    const block = e.target.closest('.question');
    if (!block) return;
    const q = questions[Number(block.dataset.index)];
    if (!q) return;

    if (q.type === 'radio' || q.type === 'scale' || q.type === 'select') {
      const ci = block.querySelector('.custom-input');
      if (ci) {
        const isCustom = e.target.value === '__custom__';
        ci.disabled = !isCustom;
        if (isCustom) ci.focus();
      }
    } else if (q.type === 'checkbox') {
      if (e.target.classList.contains('skip-cb')) {
        if (e.target.checked) {
          block.querySelectorAll('input[type=checkbox]').forEach(c => { if (c !== e.target) c.checked = false; });
          const ci = block.querySelector('.custom-input');
          if (ci) ci.disabled = true;
        }
      } else if (e.target.classList.contains('custom-cb')) {
        const ci = block.querySelector('.custom-input');
        if (ci) {
          ci.disabled = !e.target.checked;
          if (e.target.checked) ci.focus();
        }
        if (e.target.checked) {
          const skip = block.querySelector('.skip-cb');
          if (skip) skip.checked = false;
        }
      } else if (e.target.classList.contains('opt')) {
        if (e.target.checked) {
          const skip = block.querySelector('.skip-cb');
          if (skip) skip.checked = false;
        }
      }
    } else if (q.type === 'text' || q.type === 'textarea') {
      if (e.target.classList.contains('skip-cb')) {
        const inp = block.querySelector('input[type=text], textarea');
        if (inp) inp.disabled = e.target.checked;
      }
    }
    updateOutput();
  });

  form.addEventListener('input', updateOutput);
  document.getElementById('loadBtn').addEventListener('click', loadFromJson);
  document.getElementById('refreshBtn').addEventListener('click', updateOutput);
  document.getElementById('clearBtn').addEventListener('click', () => {
    jsonInput.value = ''; questions = []; form.innerHTML = '';
    formTitle.textContent = ''; output.value = '';
    jsonError.textContent = ''; copyStatus.textContent = '';
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const text = output.value;
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      copyStatus.textContent = 'Скопировано!';
    } catch (err) {
      output.select();
      document.execCommand('copy');
      copyStatus.textContent = 'Скопировано (через выделение).';
    }
    setTimeout(() => { copyStatus.textContent = ''; }, 2000);
  });

  renderForm();
})();
</script>
</body>
</html>
